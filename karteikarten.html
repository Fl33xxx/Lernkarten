<title>Netzwerktechnik Karteikarten</title>

<style>
/* Layout: eine Spalte, oben Filter und Fortschritt, mittig die Karte, unten die Bewertung. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e8edf1; --fg:#14202b; --muted:#5a6b7a;
  --line:#cfd8df; --accent:#0a6c74; --accent-fg:#ffffff; --good:#1f7a43; --bad:#b4372b;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171e; --surface:#18232d; --surface-2:#223039; --fg:#e6edf2; --muted:#97a8b6;
  --line:#2d3d49; --accent:#4cc3cc; --accent-fg:#06262a; --good:#5fcf8a; --bad:#ff8a7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171e; --surface:#18232d; --surface-2:#223039; --fg:#e6edf2; --muted:#97a8b6;
  --line:#2d3d49; --accent:#4cc3cc; --accent-fg:#06262a; --good:#5fcf8a; --bad:#ff8a7c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toggle{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.stats{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scene{perspective:1200px}
.card{position:relative;min-height:300px;width:100%;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;
  transform-style:preserve-3d;transition:transform .35s}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.back{transform:rotateY(180deg);border-color:var(--accent)}
.tag{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.txt{font-size:1.2rem;line-height:1.4;margin:auto 0;white-space:pre-line;text-wrap:pretty}
.back .txt{font-size:1.08rem}
.hint{font-size:.8rem;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.again{color:var(--bad)} .btn.known{color:var(--good)}
.btn:hover{background:var(--surface-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .btn{padding:8px 12px;font-weight:400;font-size:.9rem}
.done{padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card,.bar>i{transition:none}}
@media (max-width:480px){.card{min-height:340px}.txt{font-size:1.1rem}}
a.sub{color:var(--accent)}
</style>
</head>

function buildChips(){
  var h='<button class="chip" data-ch="*" aria-pressed="'+allSel()+'">Alle ('+CARDS.length+')</button>';
  Object.keys(CH).forEach(function(k){var n=CARDS.filter(function(c){return c.ch===k}).length;
    h+='<button class="chip" data-ch="'+k+'" aria-pressed="'+(!!state.sel[k])+'">'+CH[k]+' ('+n+')</button>'});
  $("chips").innerHTML=h;
}
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  var k=b.getAttribute("data-ch");
  if(k==="*")state.sel={};else{if(state.sel[k])delete state.sel[k];else state.sel[k]=1}
  save();buildChips();rebuild(true)});
$("onlyOpen").checked=state.only;
$("onlyOpen").addEventListener("change",function(){state.only=this.checked;save();rebuild(true)});

function rebuild(keepFirst){
  var base=state.order||CARDS.map(function(c){return c.id});
  list=base.map(function(i){return CARDS[i]}).filter(function(c){
    return (allSel()||state.sel[c.ch])&&(!state.only||!state.known[c.id])});
  if(keepFirst)idx=0;if(idx>=list.length)idx=0;flipped=false;render();
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
  var scope=CARDS.filter(function(c){return allSel()||state.sel[c.ch]});
  var k=scope.filter(function(c){return state.known[c.id]}).length;
  $("stats").textContent=k+" / "+scope.length+" gewusst"+(list.length?" · Karte "+(idx+1)+" von "+list.length:"");
  $("barFill").style.width=(scope.length?100*k/scope.length:0)+"%";
  var sc=$("scene");
  if(!list.length){sc.innerHTML='<div class="done"><strong>Keine offenen Karten.</strong><p class="sub">Schalte „nur offene Karten“ aus oder lösche den Fortschritt.</p></div>';$("btns").hidden=true;return}
  $("btns").hidden=false;
  var c=list[idx];
  sc.innerHTML='<button class="card'+(flipped?' flipped':'')+'" id="card" type="button" aria-label="Karte umdrehen">'+
    '<span class="face front"><span class="tag">'+CH[c.ch]+(state.known[c.id]?' · gewusst':'')+'</span><span class="txt">'+esc(c.q)+'</span><span class="hint">Antwort zeigen</span></span>'+
    '<span class="face back"><span class="tag">Antwort</span><span class="txt">'+esc(c.a)+'</span></span></button>';
  $("card").addEventListener("click",flip);
}
function flip(){flipped=!flipped;var c=$("card");if(c)c.classList.toggle("flipped",flipped)}
function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;flipped=false;render()}
function mark(v){if(!list.length)return;var c=list[idx];if(v)state.known[c.id]=1;else delete state.known[c.id];save();
  if(state.only&&v){list.splice(idx,1);if(idx>=list.length)idx=0;flipped=false;render()}else go(1)}
$("known").addEventListener("click",function(){mark(true)});
$("again").addEventListener("click",function(){mark(false)});
$("shuffle").addEventListener("click",function(){var a=CARDS.map(function(c){return c.id});
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  state.order=a;rebuild(true)});
$("reset").addEventListener("click",function(){state.known={};save();rebuild(false)});
document.addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){if(e.target&&e.target.tagName==="BUTTON"&&e.target.id!=="card")return;e.preventDefault();flip()}
  else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="1")mark(false);else if(e.key==="2")mark(true)});
buildChips();rebuild(true);
</script>
</body>
</html>
